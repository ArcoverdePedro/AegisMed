# Stack completa: PostgreSQL e Redis do compose.
# Outras combinacoes: compose.sem-postgres.yml, compose.sem-redis.yml,
# compose.sem-redis-sem-postgres.yml (use -f <arquivo> ou COMPOSE_FILE=<arquivo> no .env).
name: aegismed

services:
  postgres:
    extends: {file: compose.base.yml, service: postgres}

  redis:
    extends: {file: compose.base.yml, service: redis}

  aegis_med:
    extends: {file: compose.base.yml, service: aegis_med}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegismed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegismed}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
