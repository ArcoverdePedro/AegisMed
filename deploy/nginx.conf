# Exemplo de proxy HTTPS do AegisMed com nginx instalado no proprio servidor.
# O compose nao sobe proxy: a aplicacao escuta so em 127.0.0.1:8000 (APP_BIND/APP_PORT).
#
# Uso: troque his.exemplo.gov.br e os caminhos dos certificados, copie para
# /etc/nginx/conf.d/aegismed.conf e rode `nginx -t && systemctl reload nginx`.
# Certificado: certbot (dominio publico) ou o emitido pela CA do hospital.
#
# No .env: TRUSTED_PROXY_IPS=172.16.0.0/12 (o container ve o gateway da rede Docker como origem).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name his.exemplo.gov.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name his.exemplo.gov.br;

    ssl_certificate     /etc/letsencrypt/live/his.exemplo.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/his.exemplo.gov.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Mesmo limite de FILE_MAX_UPLOAD_MB (+ folga do multipart).
    client_max_body_size 52m;
    gzip on;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (mapa de leitos e paineis em tempo real).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
