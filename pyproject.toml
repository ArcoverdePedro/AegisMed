[project]
name = "aegismed"
version = "0.2.0"
description = "Sistema de informação hospitalar e colaboração segura em Django"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "crispy-bulma>=0.12.0",
    "cryptography>=50.0.2",
    "django>=6.1.3,<7.0",
    "django-auditlog>=3.4.2,<4.0",
    "django-crispy-forms>=2.7",
    "django-environ>=0.14.0,<1.0",
    "django-feather>=0.3.0",
    "django-htmx>=1.29.0",
    "django-simple-bulma>=4.0.0",
    "granian>=2.8.9",
    "pillow>=13.0.0",
    "psycopg>=3.3.9,<4.0",
    "pyotp>=2.12.1,<3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentry-sdk>=3.0.1,<4.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "granian[reload]>=2.8.9",
    "taskipy>=1.14.1",
    "isort>=9.0.2",
]

[tool.ruff]
line-length = 100
exclude = [
    "venv/",
    ".venv/",
    "env/",
    ".env/",
    "build/",
    "dist/",
    "*.egg-info/",
    "*.db",
    "*.sqlite3",
    "*.log",
    "aegis_med/migrations/",
    "test_tmp_*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Django usa listas mutaveis declarativas em Model.Meta, ModelAdmin e Forms.
    "RUF012",
    # Guard clauses deixam regras de dominio como validade de links mais explicitas.
    "SIM103",
    # O parser de filtros de data fica mais legivel com try/except ValueError explicito.
    "SIM105",
]

[tool.taskipy.tasks]
fmt = "isort . && ruff check --fix && ruff format"
check = "ruff check . && python manage.py check"
test = "python manage.py test --verbosity 2"
server = "granian mysite.asgi:application --interface asgi --host 0.0.0.0 --port 8000"
migrate = "python manage.py migrate"
