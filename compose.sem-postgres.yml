# Redis do compose; PostgreSQL externo via DATABASE_URL no .env.
# Uso: docker compose -f compose.sem-postgres.yml up -d  (ou COMPOSE_FILE no .env)
name: aegismed

services:
  redis:
    extends: {file: compose.base.yml, service: redis}

  aegis_med:
    extends: {file: compose.base.yml, service: aegis_med}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env (PostgreSQL externo)}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
